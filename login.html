<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Assistant Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="favicon.png">

</head>

<body>

<div class="login-card">
    <form onsubmit="event.preventDefault(); location.href='dashboard.html';">

        <div class="input-group">
            <label>Email Address</label>
            <div class="input-wrapper">
                <i class="far fa-envelope"></i>
                <input type="email" placeholder="farmer@example.com" required>
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Enter your password" required>
                <i class="far fa-eye toggle-password"></i>
            </div>
        </div>

        <div class="forgot-pw">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="divider">
        <span>New to Agriculture Assistant?</span>
    </div>

    <button class="btn-signup">Create New Account</button>
</div>

</body>

</html>
